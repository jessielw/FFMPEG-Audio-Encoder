name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        # apt ships the ffmpeg most Linux users already have; the static build is a
        # current one. Testing only the first is how an ffmpeg 9 filter regression got
        # past every green run here and was not seen until a release tag built on
        # macOS and Windows, where the package managers ship the newer ffmpeg.
        ffmpeg: [distro, latest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - if: matrix.ffmpeg == 'distro'
        run: sudo apt-get install -y ffmpeg
      - if: matrix.ffmpeg == 'latest'
        run: |
          set -euo pipefail
          curl -fsSL -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          rm ffmpeg.tar.xz
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      # Named in the log so a failure that turns out to be version specific says which
      # ffmpeg it was without a rerun.
      - run: ffmpeg -version | head -1
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest

  bundle:
    # main is the default branch and was missing here, so nothing built or smoke-tested
    # the macOS and Windows bundles between one PR and the next release tag.
    if: >-
      github.event_name == 'pull_request'
      || contains(fromJSON('["refs/heads/main", "refs/heads/master", "refs/heads/v5"]'), github.ref)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --group dev --group build
      - run: uv run pytest
      - run: uv run python build.py
      - if: runner.os == 'Windows'
        run: .\dist\FFMPEGAudioEncoder\FFMPEGAudioEncoder.exe --version
      - if: runner.os == 'Windows'
        run: .\dist\FFMPEGAudioEncoder\FFMPEGAudioEncoder.exe --diagnostics
      - if: runner.os == 'Linux'
        run: ./dist/FFMPEGAudioEncoder/FFMPEGAudioEncoder --version
      - if: runner.os == 'Linux'
        run: ./dist/FFMPEGAudioEncoder/FFMPEGAudioEncoder --diagnostics
      - if: runner.os == 'macOS'
        run: ./dist/FFMPEGAudioEncoder.app/Contents/MacOS/FFMPEGAudioEncoder --version
      - if: runner.os == 'macOS'
        run: ./dist/FFMPEGAudioEncoder.app/Contents/MacOS/FFMPEGAudioEncoder --diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: FFMPEGAudioEncoder-${{ matrix.os }}
          path: dist/

  docs:
    # Deploys happen only on a published release, so this build-only pass is what stops a
    # broken link from being discovered at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --only-group docs
      # The reference page is generated, not committed. domain/ and encoders/ are
      # stdlib-only, so this needs the source on the path and nothing installed.
      - run: uv run --no-sync python tools/generate_encoder_reference.py
        env:
          PYTHONPATH: src
      - run: uv run --no-sync zensical build --clean --strict
